# Zyklus: build and verify on GitHub's runners. Deploying is the server's job.
#
# NOTHING HERE DEPLOYS. There is no self-hosted runner on this repo and no
# deploy secret, so a pull_request from a fork can run only what you see below,
# on GitHub's own machines, with a read-only token.
#
# The Hetzner box asks instead of being told: a timer polls this repo for the
# newest green run on main and publishes the `site` artifact that run built
# (/opt/ci/bin/github-pull on the server). Nothing on the internet can make the
# box deploy anything, and no runner token lives there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# read-only by default: nothing here needs to write to the repo
permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      # API: typecheck and tests (auth, sync, rate limits)
      - name: Server checks
        run: pnpm --dir server typecheck && pnpm --dir server test

      # typecheck, lint and the domain unit tests
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: The build produced a real app
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest

      # mobile end-to-end smoke: onboarding, workout, nutrition, all routes
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error
