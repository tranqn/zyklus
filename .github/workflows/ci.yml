# Zyklus: build and verify on GitHub's runners. Deploying is the server's job.
#
# NOTHING HERE DEPLOYS. There is no self-hosted runner on this repo and no
# deploy secret, so a pull_request from a fork can run only what you see below,
# on GitHub's own machines, with a read-only token.
#
# The Hetzner box asks instead of being told. Every green run on main pushes
# the finished app to the `site` branch, and a timer on the box pulls that
# branch with the read-only deploy key it already has (/opt/ci/bin/github-pull).
# Nothing on the internet can make the box deploy anything, no runner token
# lives there, and this workflow holds no server credential.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# read-only by default: only publish-site asks for more, and only on main
permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      # API: typecheck and tests (auth, sync, rate limits)
      - name: Server checks
        run: pnpm --dir server typecheck && pnpm --dir server test

      # typecheck, lint and the domain unit tests
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: The build produced a real app
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest

      # mobile end-to-end smoke: onboarding, workout, nutrition, all routes
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error

  # The built app goes to the `site` branch, which the server pulls. Only runs
  # on main reach this: a pull_request from a fork gets a read-only token from
  # GitHub whatever its workflow file asks for, so it cannot write the branch.
  publish-site:
    name: Push the build to the site branch
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-branch
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site

      - name: The artifact is a real app
        run: test -f site/index.html && test -f site/sw.js

      # A note at the branch root, outside site/, so it is never published.
      - name: Explain the branch
        run: |
          cat > README.md <<'EOF'
          # site

          Maschinell erzeugt. Dieser Branch enthaelt die gebaute App in `site/`,
          gepusht von der CI nach einem gruenen Lauf auf `main`. Die Betreffzeile
          des Commits ist der `main`-Commit, aus dem der Build stammt.

          Hier von Hand etwas zu aendern ist sinnlos: der naechste gruene Lauf
          ueberschreibt den Branch.
          EOF

      # One orphan commit, overwritten every time: the branch never grows a
      # history of build outputs, so the repository does not swell per deploy.
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          git init -q -b site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site README.md
          git commit -q -m "$SHA" -m "Build aus Lauf $GITHUB_RUN_ID."
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/site
