# Zyklus: build on GitHub's runners, publish on the Hetzner box.
#
# The app is a static PWA, so the server only receives the finished dist and
# swaps it in. The publish job runs on a self-hosted runner inside the server.
#
# WHILE THIS REPO IS PRIVATE, the `if:` guards below are what keeps the deploy
# jobs on main. They would NOT hold in a public repo: on a pull_request event
# GitHub runs the workflow file from the fork, so a stranger could drop the
# guards, keep `runs-on: [self-hosted, ...]` and get code execution on the box.
# Before this repo goes public the two deploy jobs move to a private repo and
# the runner is unregistered here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# read-only by default: nothing here needs to write to the repo
permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      # API: typecheck and tests (auth, sync, rate limits)
      - name: Server checks
        run: pnpm --dir server typecheck && pnpm --dir server test

      # typecheck, lint and the domain unit tests
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: The build produced a real app
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest

      # mobile end-to-end smoke: onboarding, workout, nutrition, all routes
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy-api:
    name: Deploy API to Hetzner
    needs: [build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hetzner, deploy]
    concurrency:
      group: deploy-zyklus-api
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      # no checkout: the root-owned deploy script fetches the commit itself and refuses
      # anything that is not on origin/main, then builds, probes and rolls back if unhealthy
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: /opt/ci/bin/deploy zyklus-api "$SHA"

  publish:
    name: Publish to Hetzner
    # the new frontend may rely on new API routes, so the API goes first
    needs: [build, deploy-api]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hetzner, deploy]
    concurrency:
      group: deploy-zyklus
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site

      # rsync into staging, swap in with a rename, roll back if TLS probe fails
      - name: Publish
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: /opt/ci/bin/deploy zyklus --from "$GITHUB_WORKSPACE/site"
