# Zyklus: build on GitHub's runners, publish on the Hetzner box.
#
# The app is a static PWA, so the server only receives the finished dist and
# swaps it in. The publish job runs on a self-hosted runner inside the server,
# so it has no pull_request path and refuses anything but main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      # API: typecheck and tests (auth, sync, rate limits)
      - name: Server checks
        run: pnpm --dir server typecheck && pnpm --dir server test

      # typecheck, lint and the domain unit tests
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: The build produced a real app
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest

      # mobile end-to-end smoke: onboarding, workout, nutrition, all routes
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy-api:
    name: Deploy API to Hetzner
    needs: [build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hetzner, deploy]
    concurrency:
      group: deploy-zyklus-api
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      # no checkout: the root-owned deploy script fetches the commit itself and refuses
      # anything that is not on origin/main, then builds, probes and rolls back if unhealthy
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: /opt/ci/bin/deploy zyklus-api "$SHA"

  publish:
    name: Publish to Hetzner
    # the new frontend may rely on new API routes, so the API goes first
    needs: [build, deploy-api]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hetzner, deploy]
    concurrency:
      group: deploy-zyklus
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # rsync into staging, swap in with a rename, roll back if TLS probe fails
      - name: Publish
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: /opt/ci/bin/deploy zyklus --from "$GITHUB_WORKSPACE/site"
