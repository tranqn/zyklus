# Zyklus API. The host overlay (compose.hetzner.yml, untracked) binds the port to 127.0.0.1.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - zyklus-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  zyklus-data:
