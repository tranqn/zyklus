# /opt/ci/projects/zyklus-api.conf on the Hetzner box (root-owned). The server file is authoritative.
# The checkout lives at /opt/zyklus-api; git commands work from the server/ subdirectory,
# so WORKDIR and COMPOSE_DIR both point there.
KIND=compose
BRANCH=main
WORKDIR=/opt/zyklus-api/server
COMPOSE_DIR=/opt/zyklus-api/server
COMPOSE_PROJECT=zyklus-api
COMPOSE_FILES="-f compose.yml -f compose.hetzner.yml"
# untracked, server only: the overlay has a copy in /opt/ci/overlays/zyklus-api/, .env does not (SMTP secret)
REQUIRED_FILES="compose.hetzner.yml .env"
HEALTH_PORT=8006
HEALTH_HOST=mci.quocnamtran.com
HEALTH_PATH=/api/health
HEALTH_RETRIES=30

# github-pull: newest run on main with conclusion success and event push, built
# from this repository rather than a fork. Reading that list needs no token
# once the repo is public; deploy re-checks the sha is on origin/main anyway.
GITHUB_REPO=tranqn/zyklus
WORKFLOW=CI
