# /opt/ci/projects/zyklus.conf on the Hetzner box (root-owned).
# Static PWA. Built on the GitHub-hosted runner; this box only swaps dist in.
# Pulled, not pushed: there is no runner here any more (deploy/host/github-pull).
KIND=static
BRANCH=main
PUBLISH_DIR=/opt/zyklus/site
HEALTH_SCHEME=https
HEALTH_HOST=mci.quocnamtran.com
HEALTH_PATH=/
HEALTH_RETRIES=20

# github-pull: the CI pushes the finished dist to the site branch, and this box
# fetches it with the read-only deploy key it already has. SITE_SUBDIR is what
# gets published, so the checkout's .git never reaches the live directory.
SITE_REMOTE=git@github.com:tranqn/zyklus.git
SITE_BRANCH=site
SITE_CHECKOUT=/opt/zyklus-site
SITE_SUBDIR=site
